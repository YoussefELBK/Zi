:root {
  --ground: #EBEFF4; --surface: #FFFFFF; --raised: #F4F6FA;
  --ink: #15213A; --ink-2: #56627A; --ink-3: #8D97AA;
  --line: #D8DFE8; --line-2: #E6EBF1;
  --dem: #3453D1; --off: #D9820B; --etat: #DC3F35; --ok: #138A63;
  --loss: #9AA4B6; --loss-bg: rgba(154, 164, 182, .12);
  --font: "Onest", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r-s: 12px; --r-m: 18px; --r-l: 24px;
  --ease: cubic-bezier(.22, .8, .24, 1); --spring: cubic-bezier(.34, 1.36, .5, 1);
  --pad: 18px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0E1524; --surface: #172137; --raised: #1D2841;
    --ink: #E8EDF5; --ink-2: #A3AEC3; --ink-3: #6E7A92;
    --line: #2A3650; --line-2: #222D44;
    --dem: #7B96FF; --off: #FFB347; --etat: #FF6B5E; --ok: #3CC896;
    --loss: #6E7A92; --loss-bg: rgba(110, 122, 146, .14);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--dem); outline-offset: 2px; border-radius: 8px; }
b, strong { font-weight: 600; }
.D { color: var(--dem); } .S { color: var(--off); } .E { color: var(--etat); } .ok { color: var(--ok); } .muted { color: var(--ink-3); }
.hl-D { color: var(--dem); font-weight: 600; } .hl-S { color: var(--off); font-weight: 600; } .hl-E { color: var(--etat); font-weight: 600; }

/* ---------- Coque ---------- */
.app { height: 100vh; height: 100dvh; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 8px; min-height: 56px; }
.top .logo { width: 30px; height: 30px; border-radius: 8px; flex: none; display: block; }
.title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.title h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; }
.title .sub { color: var(--ink-3); font-size: 14px; font-weight: 500; }
.round { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); transition: transform .2s var(--spring), opacity .2s; }
.round svg { width: 18px; height: 18px; }
.round:active { transform: scale(.9); }
.round[disabled] { opacity: .3; pointer-events: none; }
.back { display: none; }
body.in-lesson .back { display: grid; }
body.in-lesson .top .logo { display: none; }

.box { flex: 1; min-height: 0; position: relative; overflow: hidden; container-type: size; container-name: box; }
.pane { position: absolute; inset: 0; padding: 0 var(--pad) 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.pane::-webkit-scrollbar { display: none; }
.in-r { animation: inR .42s var(--ease); } .in-l { animation: inL .42s var(--ease); } .in-f { animation: inF .38s var(--ease); }
@keyframes inR { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes inL { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes inF { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.swap { animation: inF .32s var(--ease); }

.tabbar { flex: none; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line-2); transition: transform .35s var(--ease); }
body.in-lesson .tabbar { display: none; }
.tabbar-inner { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: 58px; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); transition: color .25s; }
.tab svg { width: 24px; height: 24px; transition: transform .35s var(--spring); }
.tab .lbl { font-size: 11px; font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { transform: translateY(-1px) scale(1.06); }

/* ---------- Éléments communs ---------- */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-l); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 99px; font-weight: 600; font-size: 15.5px; white-space: nowrap; background: var(--ink); color: var(--ground); transition: transform .2s var(--spring), opacity .2s, background .2s; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.chips { flex: none; position: relative; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--pad)); padding: 1px var(--pad); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; font-weight: 500; transition: background .2s, color .2s, border-color .2s, transform .2s var(--spring); }
.chip:active { transform: scale(.94); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* Curseur */
.sl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.sl .l { font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.sl .v { font-size: 14px; font-weight: 600; min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; touch-action: pan-y; --c: var(--ink); --fill: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--c) var(--fill), var(--line) var(--fill)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--c); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--c); box-shadow: 0 2px 8px rgba(8, 13, 25, .18); transition: transform .2s var(--spring); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--c); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }

/* Contrôle segmenté */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); }
.seg button { position: relative; z-index: 1; height: 34px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); transition: color .25s; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-pressed="true"] { color: var(--ground); }
.seg .thumb { position: absolute; z-index: 0; top: 0; left: 0; height: 34px; border-radius: 10px; background: var(--ink); transition: transform .45s var(--spring), width .3s var(--ease); }
.seg.two { grid-auto-flow: row; grid-template-columns: 1fr 1fr; row-gap: 2px; }

/* Lectures chiffrées */
.readout { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { flex: 1 1 0; min-width: 0; padding: 7px 9px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); }
.stat .k { font-size: 11px; color: var(--ink-3); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.share { height: 30px; border-radius: 10px; overflow: hidden; display: flex; font-size: 12.5px; font-weight: 600; background: var(--line-2); }
.share > div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; transition: flex-grow .6s var(--ease); color: #fff; min-width: 0; }
.share .D { background: var(--dem); } .share .S { background: var(--off); }
@media (prefers-color-scheme: dark) { .share > div { color: #0E1524; } }

/* ---------- Feuille ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; visibility: hidden; transition: visibility 0s linear .5s; }
.sheet-root.is-open { pointer-events: auto; visibility: visible; transition: none; }
.backdrop { position: absolute; inset: 0; background: rgba(8, 13, 25, .42); opacity: 0; transition: opacity .35s var(--ease); }
.sheet-root.is-open .backdrop { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 620px; max-height: 86dvh; overflow: hidden; background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0; padding: 10px 22px calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateY(105%); transition: transform .5s var(--spring); box-shadow: 0 -12px 40px rgba(8, 13, 25, .18); }
.sheet-root.is-open .sheet { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.015em; }
.sheet p { margin: 0 0 10px; color: var(--ink-2); font-size: 15.5px; }
.sheet p b { color: var(--ink); }
.sheet .eg { padding: 10px 12px; border-radius: 12px; background: var(--raised); font-size: 14.5px; color: var(--ink-2); margin-bottom: 12px; }
.sheet .acts { display: flex; gap: 8px; }
.sheet .acts .btn { flex: 1; }

.toast { position: fixed; left: 50%; bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 14px); z-index: 60; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; width: min(92vw, 440px); padding: 12px 16px; border-radius: 16px; background: var(--ink); color: var(--ground); font-size: 14.5px; transition: opacity .3s var(--ease), transform .4s var(--spring); }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

.ex.cp { border-left: 4px solid var(--c3); }

.opts.col { grid-template-columns: 1fr; } .opts.col .opt { min-height: 42px; font-size: 14px; }

.cell.fill { animation: popin .4s var(--spring); } .cell.ok { color: var(--c2); border-color: var(--c2); } .cell.meh { color: var(--c4); border-color: var(--c4); }

    seg($("#d3", p), LENS.map((x) => String(x)), (i) => { D.n = i; saveD(); }, D.n);
    $("#gen", p).addEventListener("click", () => startDrill(buildSeries()));
    const ag = $("#again", p); if (ag) ag.addEventListener("click", () => startDrill(last));
  }
  function startDrill(series) {
    last = series; const reps = REPS[D.reps];
    const sc = series.map((it, i) => drillScreen(it, reps, `Copie ${i + 1}/${series.length}`));
    runSeq("Entraînement", `${plural(series.length, "élément")} · ×${reps}`, () => go("drill"), sc, (res, c) => {
      const tot = res.length, ok = res.filter((r) => r.ok).length, bad = [...new Set(res.filter((r) => !r.ok).map((r) => r.c))];
      Z.touch(); saveD();
      result(c, { score: tot ? ok / tot : null, sub: "copies nettes", title: tot ? "Série terminée" : "Série passée", text: !tot ? "Aucune copie faite cette fois. Relance la série quand tu veux : elle se régénère à chaque fois." : `${plural(tot, "copie")}, dont ${ok} sans reprise.${bad.length ? ` À retravailler : <span class="cjk">${bad.join(" ")}</span>` : " Rien à reprendre : bravo."}`,
        btns: [bad.length ? { t: "Refaire les ratés", cls: "ghost", fn: () => startDrill(bad.map((x) => ({ c: x }))) } : { t: "Même série", cls: "ghost", fn: () => startDrill(series) }, { t: "Nouvelle série", fn: () => startDrill(buildSeries()) }] });
    });
  }
  /* Une ligne du cahier : le modèle, puis des copies qui se remplissent case par case */
  function drillScreen(it, reps, lab) {
    return (s) => {
      const seq = it.w ? [...it.w[0]] : [it.c], py = it.w ? it.w[1] : Z.pinyinOf(it.c), fr = it.w ? it.w[2] : CH[it.c] ? CH[it.c].fr : "", withModel = Math.ceil(reps / 2);
      let r = 0, k = 0, miss = 0, w;
      s.stage.innerHTML = `<div class="drill"><span class="kicker">${lab} · ${it.w ? "mot" : "caractère"}</span><div class="th"><b class="py">${pyHTML(py)}</b><span class="fr">${esc(fr)}</span><button class="spk" data-say="${esc(seq.join(""))}">${I.spk}</button></div>
        <div class="cahier ${seq.length > 1 ? "w" : ""}" style="--len:${seq.length}"><span class="cell model">${seq.map((x) => glyph(x, { mono: true })).join("")}</span>${Array.from({ length: reps }, (_, i) => `<span class="cell ${i < withModel ? "wm" : "mem"}" data-i="${i}"></span>`).join("")}</div>
        <div class="dbox big">${grid}<div class="wr" id="wr"></div></div><p class="hint" id="dh"></p></div>`;
      const cells = $$(".cahier .cell:not(.model)", s.stage);
      const hint = () => { $("#dh", s.stage).innerHTML = `Copie ${r + 1}/${reps} · ${r < withModel ? "avec le modèle" : "<b>de mémoire</b>"}${seq.length > 1 ? ` · caractère ${k + 1}/${seq.length} : <span class="cjk">${seq[k]}</span>` : ""}`; cells.forEach((x, i) => x.classList.toggle("cur", i === r)); };
      const start = () => { hint(); w = makeWriter($("#wr", s.stage), seq[k], { showOutline: r < withModel }); w.quiz({ leniency: 1.35, showHintAfterMisses: r < withModel ? 1 : 2, onComplete: ({ totalMistakes: m }) => {
        miss += m; const c = seq[k], st = (stats[c] = stats[c] || { n: 0, e: 0 }); st.n++; if (m > 1) st.e++;
        k++; if (k < seq.length) return setTimeout(start, 250);
        const cell = cells[r]; cell.innerHTML = seq.map((x) => glyph(x, { mono: true })).join(""); cell.classList.add(miss <= 1 ? "ok" : "meh", "fill"); s.res.push({ ok: miss <= 1, c: it.w ? it.w[0] : it.c }); if (miss <= 1) burst(cell);
        r++; k = 0; miss = 0;
        if (r < reps) setTimeout(start, 350); else { $("#dh", s.stage).innerHTML = "Ligne terminée."; cells.forEach((x) => x.classList.remove("cur")); btns(s.pnav, [{ t: "Suivant", fn: s.next }]); setTimeout(() => { if (document.body.contains(s.stage)) s.next(); }, 1400); }
      } }); };
      start();
      btns(s.pnav, [{ t: `${I.eye} Montrer`, cls: "ghost", fn: () => { w.cancelQuiz(); w.animateCharacter({ onComplete: start }); } }, { t: "Passer la ligne", cls: "ghost", fn: s.next }]);
    };
  }

  /* ---------- Mes mots ---------- */
  function renderMine() {
    const per = Math.max(3, Math.floor((($("#box").clientHeight || 500) - 220) / 58)), list = Z.mine.slice().reverse(), pages = Math.max(1, Math.ceil(list.length / per)); nav.wp = Math.min(nav.wp, pages - 1);
    const p = mount(`<div class="card mhead"><p>Un mot croisé en cours, dans une série, sur un menu ? Ajoute-le : Zì le décompose, te montre l’ordre des traits et l’intègre à tes révisions.</p><button class="btn" id="add">${I.plus} Ajouter un mot</button></div>
      <div class="card mlist">${list.length ? list.slice(nav.wp * per, nav.wp * per + per).map((m, i) => `<button class="mrow" data-w="${esc(m.w)}" style="animation-delay:${i * 0.05}s"><span class="mw">${esc(m.w)}</span><span class="pt"><b>${esc(m.fr)}</b><small>${pyHTML(m.py)}</small></span><span class="chev">${I.next}</span></button>`).join("") : `<p class="hint">Aucun mot pour l’instant. Essaie 咖啡 (café) ou 医生 (médecin).</p>`}${pages > 1 ? `<div class="cpg"><button class="round sm" id="pp" ${nav.wp ? "" : "disabled"}>${I.back}</button><span>${nav.wp + 1}/${pages}</span><button class="round sm" id="pn" ${nav.wp < pages - 1 ? "" : "disabled"}>${I.next}</button></div>` : ""}</div>
      ${list.length ? `<button class="btn ghost" id="prac">${I.pen} S’entraîner sur mes mots</button>` : ""}`, "mine-pane");
    $("#add", p).addEventListener("click", addWord);
    $$(".mrow", p).forEach((b) => b.addEventListener("click", () => wordSheet(b.dataset.w)));
    const pp = $("#pp", p), pn = $("#pn", p); if (pp) { pp.addEventListener("click", () => { nav.wp--; renderMine(); }); pn.addEventListener("click", () => { nav.wp++; renderMine(); }); }
    const pr = $("#prac", p); if (pr) pr.addEventListener("click", practiceMine);
  }
  function addWord() {
    Sheet.open(`<div class="grab"></div><h2>Ajouter un mot</h2><div class="form"><label><span>Caractères</span><input id="aw" type="text" placeholder="ex. 医生" autocomplete="off"></label><label><span>Pinyin</span><input id="ap" type="text" placeholder="rempli automatiquement"></label><label><span>Sens en français</span><input id="af" type="text" placeholder="ex. médecin"></label></div><div id="apv" class="apv"></div><p class="note">Le pinyin proposé vient du dictionnaire, caractère par caractère : vérifie les tons (sandhi, ton neutre).</p><div class="acts"><button class="btn ghost" id="x">Annuler</button><button class="btn" id="ok">Ajouter</button></div>`);
    const aw = $("#aw"), ap = $("#ap");
    aw.addEventListener("input", () => { const w = [...aw.value].filter((c) => /\p{Script=Han}/u.test(c)).join(""); ap.value = [...w].map((c) => (DICT[c] ? DICT[c].py[0] : "?")).join(" "); $("#apv").innerHTML = [...w].map((c) => `<span class="apc"><b>${esc(c)}</b><small>${CH[c] ? esc(CH[c].fr) : DICT[c] ? esc(DICT[c].dc.replace(/[？]/g, "")) : "inconnu"}</small></span>`).join(""); });
    $("#x").addEventListener("click", () => Sheet.close());
    $("#ok").addEventListener("click", () => { const w = [...aw.value].filter((c) => /\p{Script=Han}/u.test(c)).join(""), fr = $("#af").value.trim(); if (!w) return toast("Écris le mot en caractères chinois."); if (!fr) return toast("Ajoute le sens en français."); if (Z.mine.some((m) => m.w === w)) return toast("Ce mot est déjà dans ta liste."); Z.mine = [...Z.mine, { w, py: ap.value.trim(), fr, d: iso() }]; Z.addCard("x|" + w); Z.save(); Sheet.close(); [...w].forEach((c) => Z.charData(c).catch(() => {})); toast(`« ${w} » ajouté à tes révisions.`); renderMine(); });
    setTimeout(() => aw.focus(), 300);
  }
  function wordSheet(w) {
    const m = Z.mine.find((x) => x.w === w);
    Sheet.open(`<div class="grab"></div><div class="wsh"><span class="mw big">${esc(w)}</span><div><b class="py">${pyHTML(m.py)}</b><span class="fr">${esc(m.fr)}</span></div><button class="spk" data-say="${esc(w)}">${I.spk}</button></div><div class="kicker">Caractère par caractère</div><div class="wl">${[...w].map((c) => `<button class="wchip" data-c="${esc(c)}"><b>${esc(c)}</b><small>${pyHTML(Z.pinyinOf(c))}${CH[c] ? " · " + esc(CH[c].fr) : DICT[c] ? " · " + esc(DICT[c].dc.replace(/[？]/g, "")) : ""}</small></button>`).join("")}</div><div class="acts"><button class="btn ghost" id="del">${I.trash} Retirer</button><button class="btn" id="x">Fermer</button></div>`);
    $$(".wchip[data-c]").forEach((b) => b.addEventListener("click", () => charSheet(b.dataset.c)));
    $("#x").addEventListener("click", () => Sheet.close());
    $("#del").addEventListener("click", () => { Z.mine = Z.mine.filter((x) => x.w !== w); delete Z.srs["x|" + w]; Z.save(); Sheet.close(); renderMine(); });
  }
  function practiceMine() {
    const ms = pick(Z.mine, 6), sc = [];
    ms.forEach((m) => { [...m.w].forEach((c) => sc.push(traceScreen(c, true, `${m.w} · ${m.fr}`))); sc.push(choiceScreen(`<p class="qw">${esc(m.w)}</p>`, m.fr, Z.mine.filter((x) => x.w !== m.w).map((x) => x.fr).concat(pick(Object.values(CH), 4).map((x) => x.fr)), { lab: "Que veut dire ce mot ?", say: m.w })); });
    runSeq("Mes mots", plural(ms.length, "mot"), () => go("mine"), sc, (res, c) => result(c, { score: res.filter((r) => r.ok).length / res.length, sub: "réussite", title: "Entraînement terminé", text: "Tes mots restent dans les révisions espacées.", btns: [{ t: "Mes mots", fn: () => go("mine") }] }));
  }

  /* ---------- Méthode ---------- */
  function renderMethod() {
    const C = window.METHOD, p = mount(`<div class="card sci-card" id="mc"></div><div class="pager"><button class="round" id="mp">${I.back}</button><div class="dots">${C.map(() => "<i></i>").join("")}</div><button class="round" id="mn">${I.next}</button></div>`, "method-pane");
    const show = (d = 0) => {
      const k = C[nav.mi], box = $("#mc", p);
      box.innerHTML = `<div class="vis" id="mv"></div><div class="body ${d > 0 ? "in-r" : d < 0 ? "in-l" : "in-f"}"><span class="cat">${k.cat}</span><h2>${k.q}</h2><p>${k.a}</p>${k.tip ? `<p class="you">${k.tip}</p>` : ""}${k.src && k.src.length ? `<div class="srcs">${k.src.map((s) => (s.url ? `<a class="src" href="${s.url}" target="_blank" rel="noopener">${esc(s.l)}${I.link}</a>` : `<span class="src">${esc(s.l)}</span>`)).join("")}</div>` : ""}</div>`;
      k.vis($("#mv", box), Z);
      $$(".dots i", p).forEach((x, i) => x.classList.toggle("on", i === nav.mi)); $("#mp").disabled = nav.mi === 0; $("#mn").disabled = nav.mi === C.length - 1;
    };
    const turn = (d) => { const n = nav.mi + d; if (n < 0 || n >= C.length) return; nav.mi = n; show(d); };
    $("#mp", p).addEventListener("click", () => turn(-1)); $("#mn", p).addEventListener("click", () => turn(1));
    show();
  }

  $$(".tab").forEach((t) => t.addEventListener("click", () => go(t.dataset.go)));
  window.addEventListener("resize", () => $$(".seg").forEach(Z.placeThumb));
  go(TITLES[nav.tab] ? nav.tab : "today");
  window.__zi = { startDrill, buildSeries, go, openItem, charSheet, startReview, addWord, renderMine, L, items, teachable, SOUNDS };
})();

</script>
</body>
